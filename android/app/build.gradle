plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def mapsApiKey = (localProperties.getProperty('MAPS_API_KEY') ?: System.getenv('MAPS_API_KEY') ?: '').trim()

def keyPropertiesFile = rootProject.file('key.properties')
def keyProperties = new Properties()
if (keyPropertiesFile.exists()) {
    keyPropertiesFile.withReader('UTF-8') { reader ->
        keyProperties.load(reader)
    }
}

android {
    namespace = "app.next.durratalaseel"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    signingConfigs {
        release {
            keyAlias keyProperties['keyAlias']
            keyPassword keyProperties['keyPassword']
            storeFile keyProperties['storeFile'] ? file(keyProperties['storeFile']) : null
            storePassword keyProperties['storePassword']
        }
    }

    defaultConfig {
        applicationId = "app.next.durratalaseel"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        manifestPlaceholders = [
                applicationName: "android.app.Application",
                MAPS_API_KEY: mapsApiKey
        ]
    }

    buildTypes {
        release {
            signingConfig (keyPropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug)
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    aaptOptions {
        noCompress "tflite"  // Your model's file extension: "tflite", "lite", etc.
    }
}
dependencies {
    // ML Kit text recognition language packages (16.0.1+ ships 16 KB-aligned native libs)
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    implementation 'com.google.mlkit:text-recognition-devanagari:16.0.1'
    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
    
    // Firebase Messaging (upgraded from 21.1.0 for 16 KB page size support)
    implementation 'com.google.firebase:firebase-messaging:24.0.0'
    
    // Pusher Push Notifications (upgraded from 1.9.0 for better compatibility)
    implementation 'com.pusher:push-notifications-android:1.10.0'
}

flutter {
    source = "../.."
}

apply plugin: 'com.google.gms.google-services'

